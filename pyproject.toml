[project]
name = "falkordb-cognee-adapter"
version = "0.1.0"
description = "FalkorDB hybrid (graph + vector) adapter for Cognee 1.0.3"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
  { name = "david-kijko", email = "david-kijko@example.com" },
]
dependencies = [
  "cognee==1.0.3",
  "falkordb>=1.0.9,<2.0.0",
  "instructor>=1.11",
  "starlette>=0.48.0",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.3",
  "mypy>=1.0",
  "ruff",
  "types-requests",
]

[project.urls]
Repository = "https://github.com/david-kijko/falkordb-cognee-adapter"

[project.scripts]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fca = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
